[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecfi"
version = "0.1.0"
description = "Epistemic-Compute Feedback Instability: theory, discrete-event testbed, and benchmark"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "simpy>=4.0",
    "matplotlib>=3.7",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["ecfi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
